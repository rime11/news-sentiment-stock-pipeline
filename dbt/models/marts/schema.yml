
version: 2

models:
  - name: mart_stock_news
    data_tests:                                  
      - dbt_utils.unique_combination_of_columns: 
          combination_of_columns: 
          - ticker
          - article_url
          - offset_hours
    columns:
      - name: ticker
        tests:
          - not_null
          - accepted_values:
              values: ['HOOD', 'SOFI', 'STX', 'RDDT', 'GOOGL']
      - name: sentiment_category
        tests:
          - accepted_values:
               values: ['positive','negative','neutral'] 
      - name: offset_hours
        tests:
          - accepted_values:
              values: [-6,-3,-1,0,1,3,6]
      - name: open_price_movement
        tests:
          - not_null
      - name: close_price_movement
        tests:
          - not_null
      - name: high_price_movement
        tests:
          - not_null
      - name: low_price_movement
        tests:
          - not_null
      - name: volume_movement
        tests:
          - not_null




